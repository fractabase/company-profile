<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>500 - Kesalahan Sistem | Fractabase Interactive</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --primary: #06b6d4;
        --secondary: #8b5cf6;
        --tertiary: #fbbf24;
        --dark: #0f172a;
        --surface: #1e293b;
        --text-primary: #f1f5f9;
        --text-secondary: #94a3b8;
      }

      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background: linear-gradient(135deg, var(--dark) 0%, #1a202c 100%);
        color: var(--text-primary);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        line-height: 1.6;
      }

      .container {
        text-align: center;
        max-width: 600px;
        width: 100%;
      }

      .status-tag {
        font-family: "Courier New", monospace;
        font-size: 0.75rem;
        letter-spacing: 0.15em;
        color: var(--text-secondary);
        text-transform: uppercase;
        margin-bottom: 1.5rem;
      }

      .error-number {
        font-size: clamp(6rem, 15vw, 10rem);
        font-weight: 900;
        font-family: "Courier New", monospace;
        line-height: 1;
        margin-bottom: 1.5rem;
        display: flex;
        justify-content: center;
        gap: 0.5rem;
      }

      .error-number .digit-1 {
        color: var(--secondary);
      }

      .error-number .digit-2 {
        color: var(--tertiary);
      }

      .error-number .digit-3 {
        color: var(--secondary);
      }

      h1 {
        font-size: clamp(1.5rem, 4vw, 2.25rem);
        font-weight: 700;
        color: var(--text-primary);
        margin-bottom: 1rem;
      }

      h1 .dot {
        color: var(--tertiary);
      }

      p {
        font-size: clamp(0.95rem, 2vw, 1.125rem);
        color: var(--text-secondary);
        margin-bottom: 2rem;
        line-height: 1.7;
      }

      .button-group {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        align-items: center;
        margin-top: 2rem;
      }

      @media (min-width: 640px) {
        .button-group {
          flex-direction: row;
          justify-content: center;
        }
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.625rem;
        padding: 0.875rem 2rem;
        font-size: 1rem;
        font-weight: 600;
        text-decoration: none;
        border-radius: 0.75rem;
        transition: all 0.3s ease;
        cursor: pointer;
        border: none;
        min-width: 200px;
      }

      .btn-primary {
        background-color: var(--primary);
        color: var(--dark);
      }

      .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(6, 182, 212, 0.25);
      }

      .btn-secondary {
        background-color: var(--surface);
        color: var(--text-primary);
        border: 2px solid #334155;
      }

      .btn-secondary:hover {
        border-color: var(--secondary);
        transform: translateY(-2px);
      }

      .icon {
        width: 1.25rem;
        height: 1.25rem;
        stroke: currentColor;
        stroke-width: 2;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .copyright {
        position: fixed;
        bottom: 1rem;
        left: 0;
        right: 0;
        text-align: center;
        font-family: "Courier New", monospace;
        font-size: 0.75rem;
        color: var(--text-secondary);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <p class="status-tag">// STATUS : SYSTEM ERROR (500)</p>

      <div class="error-number">
        <span class="digit-1">5</span>
        <span class="digit-2">0</span>
        <span class="digit-3">0</span>
      </div>

      <h1>Terjadi Kesalahan Sistem<span class="dot">.</span></h1>

      <p>
        Maaf, terjadi kendala teknis pada sistem kami. Tim kami telah diberitahu dan sedang menangani masalah ini.
        Silakan muat ulang halaman atau kembali ke beranda.
      </p>

      <div class="button-group">
        <button class="btn btn-primary" onclick="window.location.reload()">
          <svg class="icon" viewBox="0 0 24 24">
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
          <span>Muat Ulang Halaman</span>
        </button>

        <a href="/" class="btn btn-secondary">
          <svg class="icon" viewBox="0 0 24 24">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
          <span>Kembali ke Beranda</span>
        </a>
      </div>
    </div>

    <p class="copyright">© 2026 Fractabase Interactive</p>
  </body>
</html>
